name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, no secrets: CI only checks code, it never deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install poppler-utils for the PDF checks in the end-to-end tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint, type check, test, build, run end-to-end tests and audit dependencies
        run: scripts/check.sh --install

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Block pull requests that add vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
